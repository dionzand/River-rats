name: Deploy room server

# The room server lives on Cloudflare, not on Pages. Deploys on a push that
# touches it, and can be run by hand from the Actions tab - including from a
# phone. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   - an API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  - from the right-hand side of any Cloudflare dashboard page
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'js/**'
      - 'wrangler.toml'
      - '.github/workflows/rooms.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Publish the room server
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
